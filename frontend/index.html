<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Talk with your Document</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .chat-container {
      width: 750px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .upload-box {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .upload-box input {
      margin-right: 10px;
    }

    .chat-messages {
      padding: 15px;
      height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #d1e7dd;
      align-self: flex-end;
      font-weight: 500;
    }

    .bot {
      background: #f1f3f5;
      border-left: 4px solid #2c3e50;
      align-self: flex-start;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 16px;
      cursor: pointer;
    }

    details.sources {
      margin-top: 8px;
      font-size: 13px;
      color: #444;
    }

    details.sources summary {
      cursor: pointer;
      font-weight: bold;
    }

    details.sources ul {
      margin-top: 6px;
      padding-left: 20px;
    }
  </style>
</head>

<body>

<div class="chat-container">

  <div class="chat-header">
    GenAI Document Chat
  </div>

  <div class="upload-box">
    <input type="file" id="fileInput" />
    <button onclick="upload()">Upload Document</button>
  </div>

  <div class="chat-messages" id="chat"></div>

  <div class="chat-input">
    <input
      type="text"
      id="question"
      placeholder="Ask a question..."
      onkeydown="if(event.key==='Enter') ask()"
    />
    <button onclick="ask()">Send</button>
  </div>

</div>

<script>
const chat = document.getElementById("chat");

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.innerHTML = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function upload() {
  const file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("Please select a document first.");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  await fetch("http://127.0.0.1:8000/upload", {
    method: "POST",
    body: formData
  });

  addMessage("📄 Document uploaded successfully.", "bot");
}

async function ask() {
  const input = document.getElementById("question");
  const question = input.value.trim();

  if (!question) return;

  addMessage(question, "user");
  input.value = "";

  // Thinking indicator
  addMessage("Thinking...", "bot");

  const response = await fetch("http://127.0.0.1:8000/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question })
  });

  const data = await response.json();

  // Remove "Thinking..."
  chat.removeChild(chat.lastChild);

  let answerHtml = `
    <div><b>Answer</b></div>
    <div style="margin-top:6px;">${data.answer}</div>
  `;

  if (data.sources && data.sources.length > 0) {
    answerHtml += `
      <details class="sources">
        <summary>Sources</summary>
        <ul>
          ${data.sources.map(s =>
            `<li><i>${s.section}</i>: ${s.excerpt}</li>`
          ).join("")}
        </ul>
      </details>
    `;
  }

  addMessage(answerHtml, "bot");
}
</script>

</body>
</html>
